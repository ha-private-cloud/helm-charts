apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minecraft.fullname" . }}
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "minecraft.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "minecraft.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            {{- if .Values.minecraft.rcon.enabled }}
            - name: rcon
              containerPort: 25575
              protocol: TCP
            {{- end }}
          env:
            - name: EULA
              value: {{ .Values.minecraft.eula | quote }}
            - name: TYPE
              value: {{ .Values.minecraft.type | quote }}
            - name: VERSION
              value: {{ .Values.minecraft.version | quote }}
            - name: MEMORY
              value: {{ .Values.minecraft.memory | quote }}
            - name: DIFFICULTY
              value: {{ .Values.minecraft.difficulty | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.minecraft.maxPlayers | quote }}
            - name: MOTD
              value: {{ .Values.minecraft.motd | quote }}
            - name: ONLINE_MODE
              value: {{ .Values.minecraft.onlineMode | quote }}
            - name: VIEW_DISTANCE
              value: {{ .Values.minecraft.viewDistance | quote }}
            - name: SIMULATION_DISTANCE
              value: {{ .Values.minecraft.simulationDistance | quote }}
            - name: OVERRIDE_SERVER_PROPERTIES
              value: {{ .Values.minecraft.overrideServerProperties | quote }}
            - name: ENFORCE_WHITELIST
              value: {{ .Values.minecraft.enforceWhitelist | quote }}
            {{- with .Values.minecraft.ops }}
            - name: OPS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.minecraft.whitelist }}
            - name: WHITELIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.minecraft.rcon.enabled }}
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minecraft.rcon.existingSecret }}
                  key: {{ .Values.minecraft.rcon.passwordKey }}
            {{- else }}
            - name: ENABLE_RCON
              value: "false"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "minecraft.fullname" .) }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
